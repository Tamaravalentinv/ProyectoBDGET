name: EP3 - Build, Secure and ECS Fargate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      deploy_aws:
        description: 'Authorize ECR publication and ECS deployment (main only; production approval still applies)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  LOCAL_IMAGE: bdget:${{ github.sha }}
  JACOCO_MINIMUM: '0.80'

jobs:
  build_test:
    name: Build, tests and JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and enforce JaCoCo threshold
        run: bash ./mvnw -B -ntp clean verify -Djacoco.minimum.line.coverage=${JACOCO_MINIMUM}

      - name: Run PowerShell tests and enforce coverage
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1

          New-Item -ItemType Directory -Path target/pester -Force | Out-Null
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'src/test/powershell'
          $configuration.Run.PassThru = $true
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputFormat = 'JUnitXml'
          $configuration.TestResult.OutputPath = 'target/pester/test-results.xml'
          $configuration.CodeCoverage.Enabled = $true
          $configuration.CodeCoverage.Path = '.github/scripts/Set-BranchProtection.ps1'
          $configuration.CodeCoverage.OutputFormat = 'Cobertura'
          $configuration.CodeCoverage.OutputPath = 'target/pester/coverage.xml'
          $configuration.CodeCoverage.CoveragePercentTarget = 90
          $configuration.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $configuration

          if ($result.FailedCount -gt 0 -or $result.CodeCoverage.CoveragePercent -lt 90) {
            throw "PowerShell quality gate failed: failures=$($result.FailedCount), coverage=$($result.CodeCoverage.CoveragePercent)%"
          }

          [xml] $cobertura = Get-Content 'target/pester/coverage.xml' -Raw
          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Indent = $true
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $writer = [System.Xml.XmlWriter]::Create('target/pester/sonar-generic-coverage.xml', $settings)
          $writer.WriteStartDocument()
          $writer.WriteStartElement('coverage')
          $writer.WriteAttributeString('version', '1')
          $sourceDirectory = [string] @($cobertura.coverage.sources.source)[0]
          foreach ($class in $cobertura.coverage.packages.package.classes.class) {
            $absoluteSourcePath = Join-Path $sourceDirectory ([string] $class.filename)
            $repositoryPath = (Resolve-Path -LiteralPath $absoluteSourcePath -Relative).Replace('\', '/')
            if ($repositoryPath.StartsWith('./')) { $repositoryPath = $repositoryPath.Substring(2) }
            $writer.WriteStartElement('file')
            $writer.WriteAttributeString('path', $repositoryPath)
            foreach ($line in $class.lines.line) {
              $writer.WriteStartElement('lineToCover')
              $writer.WriteAttributeString('lineNumber', [string] $line.number)
              $writer.WriteAttributeString('covered', ([int] $line.hits -gt 0).ToString().ToLowerInvariant())
              $writer.WriteEndElement()
            }
            $writer.WriteEndElement()
          }
          $writer.WriteEndElement()
          $writer.WriteEndDocument()
          $writer.Dispose()
      - name: Upload tests and real coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-coverage-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pester/
          if-no-files-found: error
          retention-days: 30
      - name: Analyze with SonarQube Cloud and wait for its Quality Gate
        if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" && test -n "$SONAR_PROJECT_KEY" && test -n "$SONAR_ORGANIZATION"
          bash ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.coverageReportPaths=target/pester/sonar-generic-coverage.xml \
            -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
      - name: Record optional Sonar status
        if: ${{ vars.SONAR_ENABLED != 'true' }}
        run: echo 'SonarQube Cloud remains optional until configured; Maven and Trivy gates are mandatory.' >> "$GITHUB_STEP_SUMMARY"

  security_scan:
    name: Dependency, secret and configuration scans
    needs: build_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore Java and Maven dependency cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Resolve dependency metadata for the scanner
        run: bash ./mvnw -B -ntp -DskipTests dependency:go-offline
      - run: mkdir -p target/security
      - name: Scan Maven dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: target/security/trivy-dependencies.json
          exit-code: '0'
      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: target
          format: json
          output: target/security/trivy-secrets.json
          exit-code: '0'
      - name: Scan infrastructure and Docker configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_OFFLINE_SCAN: 'true'
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: json
          output: target/security/trivy-config.json
          exit-code: '0'
      - name: Enforce source security gate
        shell: bash
        run: |
          secrets="$(jq '[.Results[]? | (.Secrets // [])[]?] | length' target/security/trivy-secrets.json)"
          critical_dependencies="$(jq '[.Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "CRITICAL")] | length' target/security/trivy-dependencies.json)"
          critical_config="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "CRITICAL")] | length' target/security/trivy-config.json)"
          high_config="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "HIGH")] | length' target/security/trivy-config.json)"
          printf 'secrets=%s critical_dependencies=%s critical_config=%s high_config=%s\n' "$secrets" "$critical_dependencies" "$critical_config" "$high_config"
          test "$secrets" -eq 0 && test "$critical_dependencies" -eq 0 && test "$critical_config" -eq 0 && test "$high_config" -eq 0
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security-${{ github.run_id }}
          path: target/security/*.json
          if-no-files-found: error
          retention-days: 30

  quality_gate:
    name: Mandatory quality gate
    needs: [build_test, security_scan]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Tests, coverage, dependencies, secrets and configuration gates passed.' >> "$GITHUB_STEP_SUMMARY"

  docker_build:
    name: Docker build and image security gate
    needs: quality_gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build immutable candidate image
        run: docker build --tag "${LOCAL_IMAGE}" .
      - name: Scan candidate image and block CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-image.json
          exit-code: '1'
      - name: Upload image scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-security-${{ github.run_id }}
          path: trivy-image.json
          if-no-files-found: warn
          retention-days: 30
      - name: Export exactly the scanned image
        run: docker save --output bdget-image.tar "${LOCAL_IMAGE}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-image-${{ github.run_id }}
          path: bdget-image.tar
          retention-days: 1
          compression-level: 0

  compose_validation:
    name: Local availability validation
    needs: docker_build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build isolated H2 simulation image
        run: docker build --build-arg MAVEN_PROFILE=simulation --tag "bdget-simulation:${GITHUB_SHA}" .
      - name: Start two local replicas
        env:
          BDGET_IMAGE: bdget-simulation:${{ github.sha }}
          BDGET_EVAL_PORT: '18080'
        run: |
          docker compose -f docker-compose.evaluation.yml config --quiet
          docker compose -f docker-compose.evaluation.yml up -d --no-build --scale microservicio=2
      - name: Validate readiness and HTTP response
        run: |
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/actuator/health/readiness | jq -e '.status == "UP"' >/dev/null; then break; fi
            test "$attempt" -lt 40
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/students | jq -e 'type == "array"'
          test "$(docker compose -f docker-compose.evaluation.yml ps -q microservicio | wc -l)" -eq 2
      - name: Preserve failure logs
        if: failure()
        run: docker compose -f docker-compose.evaluation.yml logs --no-color
      - name: Clean local environment
        if: always()
        run: docker compose -f docker-compose.evaluation.yml down --volumes --remove-orphans

  publish_ecr:
    name: Publish approved image to ECR
    needs: [docker_build, compose_validation]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_aws && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest_uri: ${{ steps.publish.outputs.image_digest_uri }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-image-${{ github.run_id }}
      - run: docker load --input bdget-image.tar
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Push SHA tag and resolve immutable digest
        id: publish
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          test -n "$AWS_ACCOUNT_ID" && test -n "$AWS_REGION" && test -n "$ECR_REPOSITORY"
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          tagged_image="${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}" "$tagged_image"
          docker push "$tagged_image"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text)"
          test "${digest#sha256:}" != "$digest"
          echo "image_digest_uri=${registry}/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

  deploy_ecs:
    name: Register task and deploy ECS Fargate
    needs: publish_ecr
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy and wait for service stability
        shell: pwsh
        env:
          ORACLE_SECRET_ARN: ${{ secrets.ORACLE_SECRET_ARN }}
        run: |
          ./infra/ecs/scripts/Deploy-EcsService.ps1 `
            -Region '${{ vars.AWS_REGION }}' -Cluster '${{ vars.ECS_CLUSTER }}' -Service '${{ vars.ECS_SERVICE }}' `
            -TaskFamily '${{ vars.ECS_TASK_FAMILY }}' -ImageDigestUri '${{ needs.publish_ecr.outputs.image_digest_uri }}' `
            -ExecutionRoleArn '${{ vars.ECS_EXECUTION_ROLE_ARN }}' -TaskRoleArn '${{ vars.ECS_TASK_ROLE_ARN }}' `
            -OracleSecretArn $env:ORACLE_SECRET_ARN -LogGroup '${{ vars.CLOUDWATCH_LOG_GROUP }}' `
            -SubnetIds ('${{ vars.ECS_SUBNET_IDS }}' -split ',') -SecurityGroupIds ('${{ vars.ECS_SECURITY_GROUP_IDS }}' -split ',') `
            -EfsFileSystemId '${{ vars.ORACLE_WALLET_EFS_ID }}' -EfsAccessPointId '${{ vars.ORACLE_WALLET_EFS_ACCESS_POINT_ID }}' `
            -CorsAllowedOrigins '${{ vars.CORS_ALLOWED_ORIGINS }}' `
            -TargetGroupArn '${{ vars.ALB_TARGET_GROUP_ARN }}'

  post_deploy:
    name: Post-deploy validation and metrics
    needs: deploy_ecs
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-and-coverage-${{ github.run_id }}
          path: target
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify external readiness
        env:
          SERVICE_BASE_URL: ${{ vars.SERVICE_BASE_URL }}
        run: |
          test -n "$SERVICE_BASE_URL"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 "${SERVICE_BASE_URL%/}/actuator/health/readiness" | jq -e '.status == "UP"'
      - name: Publish actual ECS, CI and coverage observations
        shell: pwsh
        run: |
          ./infra/ecs/scripts/Get-EcsStatus.ps1 -Region '${{ vars.AWS_REGION }}' -Cluster '${{ vars.ECS_CLUSTER }}' -Service '${{ vars.ECS_SERVICE }}' -EnvironmentName production -PublishMetrics
          ./infra/cloudwatch/scripts/Publish-CiMetrics.ps1 -Region '${{ vars.AWS_REGION }}' -JacocoXmlPath 'target/site/jacoco/jacoco.xml' -CiValidationSuccess 1 -Service '${{ vars.ECS_SERVICE }}' -EnvironmentName production
