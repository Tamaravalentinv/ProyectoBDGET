name: CI/CD - Test, Secure, Publish and Deploy

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run automated tests and generate coverage
        run: bash ./mvnw -B -ntp clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Validate SonarQube Cloud configuration
        if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_ORGANIZATION"

      - name: Set up Java 21 for SonarScanner
        if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Analyze code with SonarQube Cloud and enforce Quality Gate
        if: ${{ vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          bash ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Record pending SonarQube Cloud activation
        if: ${{ vars.SONAR_ENABLED != 'true' }}
        run: echo "SonarQube Cloud is configured but pending repository variables and SONAR_TOKEN activation." >> "$GITHUB_STEP_SUMMARY"

      - name: Record SonarQube Cloud skip for untrusted fork
        if: ${{ vars.SONAR_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "SonarQube Cloud was skipped because secrets are not exposed to pull requests from forks." >> "$GITHUB_STEP_SUMMARY"

      - name: Record test traceability
        run: |
          {
            echo "## Automated tests"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- Result: clean verify passed"
            echo "- Reports: test-and-coverage-reports artifact"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security analysis
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare security reports directory
        run: mkdir -p target/security

      - name: Build traceable evaluation image
        run: docker build --build-arg MAVEN_PROFILE=simulation -t bdget-simulation:${{ github.sha }} .

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_OFFLINE_SCAN: "true"
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-dirs: target
          format: json
          output: target/security/trivy-secrets.json
          exit-code: '0'

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: target/security/trivy-config.json
          exit-code: '0'

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: bdget-simulation:${{ github.sha }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: target/security/trivy-image.json
          exit-code: '0'

      - name: Scan orchestration proxy vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: image
          image-ref: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: target/security/trivy-proxy.json
          exit-code: '0'

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports-${{ github.run_id }}
          path: target/security/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce security quality gate
        shell: bash
        run: |
          secrets="$(jq '[.Results[]? | (.Secrets // [])[]?] | length' target/security/trivy-secrets.json)"
          critical_vulnerabilities="$(jq -s '[.[] | .Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "CRITICAL")] | length' target/security/trivy-image.json target/security/trivy-proxy.json)"
          high_vulnerabilities="$(jq -s '[.[] | .Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "HIGH")] | length' target/security/trivy-image.json target/security/trivy-proxy.json)"
          medium_vulnerabilities="$(jq -s '[.[] | .Results[]? | (.Vulnerabilities // [])[]? | select(.Severity == "MEDIUM")] | length' target/security/trivy-image.json target/security/trivy-proxy.json)"
          critical_misconfigurations="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "CRITICAL")] | length' target/security/trivy-config.json)"
          high_misconfigurations="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "HIGH")] | length' target/security/trivy-config.json)"
          medium_misconfigurations="$(jq '[.Results[]? | (.Misconfigurations // [])[]? | select(.Severity == "MEDIUM")] | length' target/security/trivy-config.json)"

          {
            echo "## Security quality gate"
            echo "- Commit: ${{ github.sha }}"
            echo "- Images: bdget-simulation:${{ github.sha }} and pinned Nginx proxy"
            echo "- Run: ${{ github.run_id }}"
            echo "| Finding | Count | Policy |"
            echo "| --- | ---: | --- |"
            echo "| Secrets | $secrets | Blocks |"
            echo "| Critical vulnerabilities | $critical_vulnerabilities | Blocks |"
            echo "| High vulnerabilities | $high_vulnerabilities | Report only |"
            echo "| Medium vulnerabilities | $medium_vulnerabilities | Report only |"
            echo "| Critical misconfigurations | $critical_misconfigurations | Blocks |"
            echo "| High misconfigurations | $high_misconfigurations | Blocks |"
            echo "| Medium misconfigurations | $medium_misconfigurations | Report only |"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( secrets > 0 || critical_vulnerabilities > 0 || critical_misconfigurations > 0 || high_misconfigurations > 0 )); then
            echo "Security quality gate failed. Review the uploaded Trivy reports."
            exit 1
          fi

      - name: Export validated image
        run: |
          mkdir -p target/image
          docker save --output target/image/bdget-image.tar bdget-simulation:${{ github.sha }}

      - name: Upload validated image
        uses: actions/upload-artifact@v7
        with:
          name: application-image-${{ github.run_id }}
          path: target/image/bdget-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Docker image
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: application-image-${{ github.run_id }}
          path: target/image

      - name: Load validated image
        run: docker load --input target/image/bdget-image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image with commit SHA
        env:
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'proyectobdget-simulation' }}
        run: docker tag bdget-simulation:${{ github.sha }} "${DOCKERHUB_IMAGE}:${{ github.sha }}"

      - name: Push Docker image
        env:
          DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'proyectobdget-simulation' }}
        run: |
          docker push "${DOCKERHUB_IMAGE}:${{ github.sha }}"
          digest="$(docker image inspect --format='{{index .RepoDigests 0}}' "${DOCKERHUB_IMAGE}:${{ github.sha }}")"
          {
            echo "## Published image"
            echo "- Commit: ${{ github.sha }}"
            echo "- Image: ${DOCKERHUB_IMAGE}:${{ github.sha }}"
            echo "- Digest: ${digest}"
            echo "- Run: ${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to simulated environment
    needs: [security, publish]
    if: ${{ always() && needs.security.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BDGET_IMAGE: bdget-simulation:${{ github.sha }}
      BDGET_EVAL_PORT: '18080'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: application-image-${{ github.run_id }}
          path: target/image

      - name: Load validated image
        run: docker load --input target/image/bdget-image.tar

      - name: Validate evaluation Compose configuration
        run: docker compose -f docker-compose.evaluation.yml config --quiet

      - name: Deploy application with Docker Compose
        run: docker compose -f docker-compose.evaluation.yml up -d --no-build --scale microservicio=2

      - name: Verify replicas and health
        shell: bash
        run: |
          wait_for_healthy() {
            local container_id="$1"
            local health="starting"

            for attempt in {1..30}; do
              echo "Health check for ${container_id}: attempt ${attempt}/30"
              health="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
              if [[ "$health" == "healthy" ]]; then
                return 0
              fi
              if [[ "$(docker inspect --format='{{.State.Status}}' "$container_id")" == "exited" ]]; then
                echo "Container ${container_id} exited before becoming healthy."
                return 1
              fi
              sleep 2
            done

            return 1
          }

          mapfile -t application_containers < <(docker compose -f docker-compose.evaluation.yml ps -q microservicio)
          test "${#application_containers[@]}" -eq 2

          for container_id in "${application_containers[@]}"; do
            wait_for_healthy "$container_id"
          done

          proxy_container="$(docker compose -f docker-compose.evaluation.yml ps -q proxy)"
          test -n "$proxy_container"
          wait_for_healthy "$proxy_container"
          docker compose -f docker-compose.evaluation.yml ps

      - name: Verify load balancing and real HTTP response
        shell: bash
        run: |
          for _ in {1..10}; do
            response="$(curl --fail --silent --show-error "http://127.0.0.1:${BDGET_EVAL_PORT}/students")"
            printf '%s' "$response" | jq -e 'type == "array"' > /dev/null
          done

          mapfile -t upstreams < <(docker compose -f docker-compose.evaluation.yml logs --no-color proxy | sed -n 's/.*upstream=\([^ ]*\).*/\1/p' | sort -u)
          printf 'Observed upstream: %s\n' "${upstreams[@]}"
          test "${#upstreams[@]}" -eq 2

      - name: Verify automatic container recovery
        shell: bash
        run: |
          mapfile -t application_containers < <(docker compose -f docker-compose.evaluation.yml ps -q microservicio)
          test "${#application_containers[@]}" -eq 2

          failed_container="${application_containers[0]}"
          restarts_before="$(docker inspect --format='{{.RestartCount}}' "$failed_container")"
          docker exec "$failed_container" sh -c 'kill -TERM 1'

          available=false
          for _ in {1..15}; do
            if response="$(curl --fail --silent --show-error "http://127.0.0.1:${BDGET_EVAL_PORT}/students")" && printf '%s' "$response" | jq -e 'type == "array"' > /dev/null; then
              available=true
              break
            fi
            sleep 1
          done
          test "$available" = true

          recovered=false
          for _ in {1..30}; do
            restarts_after="$(docker inspect --format='{{.RestartCount}}' "$failed_container")"
            health="$(docker inspect --format='{{.State.Health.Status}}' "$failed_container")"
            if (( restarts_after > restarts_before )) && [[ "$health" == "healthy" ]]; then
              recovered=true
              break
            fi
            sleep 2
          done
          test "$recovered" = true

          response="$(curl --fail --silent --show-error "http://127.0.0.1:${BDGET_EVAL_PORT}/students")"
          printf '%s' "$response" | jq -e 'type == "array"' > /dev/null
          docker compose -f docker-compose.evaluation.yml ps

          {
            echo "## Simulated orchestrated deployment"
            echo "- Commit: ${{ github.sha }}"
            echo "- Image: ${BDGET_IMAGE}"
            echo "- Run: ${{ github.run_id }}"
            echo "- Application replicas: 2 healthy containers"
            echo "- Entry point: Nginx proxy healthy on 127.0.0.1:${BDGET_EVAL_PORT}"
            echo "- Load balancing: both application replicas observed in proxy logs"
            echo "- Recovery: terminated JVM restarted and returned to healthy"
            echo "- Availability: GET /students returned 200 and a JSON array during and after recovery"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show deployment logs on failure
        if: failure()
        run: docker compose -f docker-compose.evaluation.yml logs --no-color

      - name: Stop simulated environment
        if: always()
        run: docker compose -f docker-compose.evaluation.yml down --volumes --remove-orphans
