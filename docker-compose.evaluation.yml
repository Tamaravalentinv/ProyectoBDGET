name: bdget-evaluation

services:
  microservicio:
    image: ${BDGET_IMAGE:-bdget:evaluation}
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: simulation
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/students"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 25s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    networks:
      - backend

  proxy:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    user: "101:101"
    read_only: true
    ports:
      - "127.0.0.1:${BDGET_EVAL_PORT:-18080}:8080"
    volumes:
      - ./nginx.evaluation.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      microservicio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1:8080/students"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 50
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
