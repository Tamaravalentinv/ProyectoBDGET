pid /tmp/nginx.pid;

events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format upstream '$remote_addr "$request" status=$status upstream=$upstream_addr';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream bdget_backend {
        zone bdget_backend 64k;
        server microservicio:8080 resolve;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://bdget_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
